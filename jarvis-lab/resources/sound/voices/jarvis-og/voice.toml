[voice]
id = "jarvis-og"
name = "Jarvis OG"
author = "Abraham (Priler)"
languages = ["ru"]

[reactions.ru]
# app startup — приветствие по времени суток (fallback: greet)
greet = ["run"]
greet_morning = ["greet_morning"]
greet_day = ["greet_day"]
greet_evening = ["greet_evening"]
